<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Cactusini — страница автора</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0c10;
            font-family: 'Unbounded', system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: #f0f3f8;
            line-height: 1.4;
            overflow-x: hidden;
        }
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 20% 30%, #0f1219, #030507);
        }
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(60, 80, 120, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(60, 80, 120, 0.08) 1px, transparent 1px);
            background-size: 48px 48px;
            z-index: -1;
            pointer-events: none;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 1.5rem 4rem;
            position: relative;
            z-index: 2;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes glowPulse {
            0% { text-shadow: 0 0 5px rgba(255,215,0,0.3); }
            100% { text-shadow: 0 0 20px rgba(255,215,0,0.7); }
        }
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeInUp 0.9s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }
        .author-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            border: 2px solid rgba(228, 179, 99, 0.6);
            box-shadow: 0 0 30px rgba(228, 179, 99, 0.3);
            transition: all 0.3s ease;
            overflow: hidden;
            background: linear-gradient(135deg, #2a2e3f, #141824);
        }
        .author-avatar:hover {
            transform: scale(1.02);
            border-color: #e4b363;
            box-shadow: 0 0 45px rgba(228, 179, 99, 0.5);
        }
        .author-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: clamp(2.2rem, 7vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #FFF6E0, #E4B363);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.75rem;
        }
        .author-badge {
            font-size: 0.8rem;
            background: rgba(228, 179, 99, 0.15);
            backdrop-filter: blur(4px);
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            border: 1px solid rgba(228, 179, 99, 0.4);
            color: #e4b363;
            font-weight: 500;
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 2rem 0 1.5rem;
            letter-spacing: -0.3px;
            color: #e4b363;
            border-left: 3px solid #e4b363;
            padding-left: 1rem;
        }
        .games-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            margin: 1rem 0 1rem;
        }
        .game-card {
            background: rgba(18, 22, 32, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            border: 1px solid rgba(228, 179, 99, 0.25);
            padding: 1.5rem 1.5rem 1.8rem;
            width: 260px;
            text-align: center;
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            cursor: pointer;
            animation: fadeInUp 0.7s ease backwards;
            box-shadow: 0 12px 28px -8px rgba(0,0,0,0.5);
        }
        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(228, 179, 99, 0.7);
            background: rgba(25, 30, 42, 0.85);
            box-shadow: 0 25px 35px -12px rgba(0,0,0,0.6);
        }
        .game-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 1.2rem;
            overflow: hidden;
            margin-bottom: 1rem;
            background: #0f121b;
        }
        .game-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }
        .game-card:hover .game-image img {
            transform: scale(1.02);
        }
        .game-title {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(120deg, #f3e5c0, #e4b363);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.8rem;
        }
        .game-link {
            display: inline-block;
            background: rgba(228, 179, 99, 0.12);
            border: 1px solid rgba(228, 179, 99, 0.5);
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            text-decoration: none;
            color: #f5e2b0;
            font-weight: 500;
            font-size: 0.75rem;
            transition: all 0.25s;
        }
        .game-link:hover {
            background: #e4b363;
            color: #0a0c10;
            border-color: #e4b363;
            box-shadow: 0 0 12px rgba(228,179,99,0.5);
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(18, 22, 32, 0.6);
            border-radius: 60px;
            padding: 0.5rem 1.2rem;
            margin-bottom: 1.5rem;
            text-decoration: none;
            color: #cfdef5;
            font-size: 0.8rem;
            font-weight: 500;
            border: 1px solid rgba(228, 179, 99, 0.3);
            transition: all 0.2s;
            cursor: pointer;
        }
        .back-link:hover {
            background: rgba(228, 179, 99, 0.2);
            border-color: #e4b363;
            color: #e4b363;
        }
        .glow-spot {
            position: fixed;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(228,179,99,0.08) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            top: -20%;
            right: -20%;
        }
        .glow-spot-2 {
            bottom: -30%;
            left: -20%;
            background: radial-gradient(circle, rgba(80,120,200,0.06) 0%, rgba(0,0,0,0) 70%);
        }
        footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.7rem;
            color: #5f6e85;
            border-top: 1px solid rgba(228,179,99,0.2);
            padding-top: 2rem;
        }
        @media (max-width: 650px) {
            .container { padding: 2rem 1.2rem; }
            .game-card { width: 100%; max-width: 280px; }
            .author-avatar { width: 110px; height: 110px; }
        }
    </style>
</head>
<body>
<div class="animated-bg"></div>
<div class="grid-overlay"></div>
<div class="glow-spot"></div>
<div class="glow-spot glow-spot-2"></div>

<div class="container">
    <div class="back-link" id="backToHomeBtn">← На главную HLEB GAME</div>

    <div class="hero">
        <div class="author-avatar" id="authorAvatar">
            <img src="https://i.oneme.ru/i?r=BTE2sh_eZW7g8kugOdIm2NotyGzrxE-KJNzcYlZWeDK3_TL_i6iagkBC3ooC5OrownA" alt="Cactusini avatar">
        </div>
        <h1 id="authorName">Cactusini</h1>
        <div class="author-badge">✦ создатель динамичных ИИ-экшенов ✦</div>
    </div>

    <div class="section-title">✦ Игры</div>
    <div class="games-grid" id="authorGamesGrid"></div>

    <footer>
        <span>HLEB GAME © 2026 — система ИИ-игр</span><br>
        <span style="font-size: 0.65rem;">нейросетевая платформа · каталог авторов</span>
    </footer>
</div>

<script>
    (function() {
        // Данные автора Cactusini
        const authorConfig = {
            name: "Cactusini",
            games: [
                {
                    title: "Neon Revenant",
                    url: "https://efatcat.github.io/shooter-oleg",
                    image: "https://i.oneme.ru/i?r=BTE2sh_eZW7g8kugOdIm2NotXkyO4ocD6NzH6e1y0BshYjL_i6iagkBC3ooC5OrownA",
                    fallbackIcon: "🔫"
                },
                {
                    title: "Dodge Easy",
                    url: "https://efatcat.github.io/dodge-easy",
                    image: null,
                    fallbackIcon: "🌀"
                }
            ]
        };

        // Устанавливаем имя автора
        const authorNameEl = document.getElementById('authorName');
        if (authorNameEl) authorNameEl.textContent = authorConfig.name;

        // Рендер списка игр
        const gamesContainer = document.getElementById('authorGamesGrid');
        if (gamesContainer) {
            gamesContainer.innerHTML = '';
            authorConfig.games.forEach((game, idx) => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.style.animationDelay = `${idx * 0.08}s`;
                
                // Блок с изображением
                const imgDiv = document.createElement('div');
                imgDiv.className = 'game-image';
                if (game.image) {
                    const img = document.createElement('img');
                    img.src = game.image;
                    img.alt = game.title;
                    img.onerror = function() { 
                        this.style.display = 'none';
                        this.parentElement.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:2.8rem;">${game.fallbackIcon}</div>`;
                    };
                    imgDiv.appendChild(img);
                } else {
                    imgDiv.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:2.8rem;">${game.fallbackIcon}</div>`;
                }
                
                const titleDiv = document.createElement('div');
                titleDiv.className = 'game-title';
                titleDiv.textContent = game.title;
                
                const linkBtn = document.createElement('a');
                linkBtn.href = game.url;
                linkBtn.className = 'game-link';
                linkBtn.textContent = 'Играть →';
                linkBtn.target = '_blank';
                linkBtn.rel = 'noopener noreferrer';
                
                card.appendChild(imgDiv);
                card.appendChild(titleDiv);
                card.appendChild(linkBtn);
                
                // Клик по карточке (кроме клика по кнопке)
                card.addEventListener('click', (e) => {
                    if (e.target === linkBtn || linkBtn.contains(e.target)) return;
                    window.open(game.url, '_blank', 'noopener,noreferrer');
                });
                
                gamesContainer.appendChild(card);
            });
        }

        // Кнопка возврата на главную
        const backBtn = document.getElementById('backToHomeBtn');
        if (backBtn) {
            backBtn.addEventListener('click', function() {
                window.location.href = 'https://efatcat.github.io/hleb';
            });
        }

        // Эффект движения блика
        const glowSpot = document.querySelector('.glow-spot');
        if (glowSpot) {
            document.addEventListener('mousemove', (e) => {
                const x = e.clientX / window.innerWidth;
                const y = e.clientY / window.innerHeight;
                glowSpot.style.transform = `translate(${x * 25}px, ${y * 15}px)`;
            });
        }
    })();
</script>
</body>
</html>
